[package]
name = "cts-departures"
version = "1.6.1"
edition = "2024"
description = "CTS departure board display"
license = "MIT"
repository = "https://github.com/jib63/CTS_destination"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
chrono = { version = "0.4", features = ["serde"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
anyhow = "1"
futures-util = "0.3"
png = "0.18"
base64 = "0.23"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
